services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      S3_DOMAIN: ${S3_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
      minio:
        condition: service_started

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recto}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-recto} -d ${POSTGRES_DB:-recto}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./infra/minio-cors.json:/tmp/cors.json:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set recto http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing recto/recto-uploads;
      mc cors set recto/recto-uploads /tmp/cors.json;
      exit 0;
      "

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_AUTH_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_TRY_FORM_ID: ${NEXT_PUBLIC_TRY_FORM_ID:-}

        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recto}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_AUTH_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      NEXT_PUBLIC_TRY_FORM_ID: ${NEXT_PUBLIC_TRY_FORM_ID:-}
      OPEN_ROUTER_KEY: ${OPEN_ROUTER_KEY:-}
      OPEN_ROUTER_MODEL: ${OPEN_ROUTER_MODEL:-deepseek/deepseek-v4-flash-0731}
      OPEN_ROUTER_SITE_URL: ${OPEN_ROUTER_SITE_URL:-https://${APP_DOMAIN}}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: https://${S3_DOMAIN}
      S3_REGION: auto
      S3_BUCKET: recto-uploads
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -c "npx prisma migrate deploy && node server.js"

  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_AUTH_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_TRY_FORM_ID: ${NEXT_PUBLIC_TRY_FORM_ID:-}

        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=3072}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recto}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recto}?schema=public
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      AUTH_URL: https://${APP_DOMAIN}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: recto-uploads
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      app:
        condition: service_started
    command: npx tsx -r tsconfig-paths/register worker.ts

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:
